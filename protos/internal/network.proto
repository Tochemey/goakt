syntax = "proto3";

package internalpb;

import "google/protobuf/any.proto";

option go_package = "github.com/tochemey/goakt/v4/internal/internalpb;internalpb";

enum Code {
  CODE_INTERNAL = 0;
  CODE_NOT_FOUND = 1;
  CODE_ALREADY_EXISTS = 2;
  CODE_INVALID_ARGUMENT = 3;
  CODE_UNAVAILABLE = 4;
  CODE_FAILED_PRECONDITION = 5;
  CODE_INTERNAL_ERROR = 6;
  CODE_DEADLINE_EXCEEDED = 7;
  CODE_RESOURCE_EXHAUSTED = 8;
  CODE_CANCELED = 9;
  CODE_UNKNOWN = 10;
}

message Error {
  Code code = 1;
  string message = 2;
  string stack_trace = 3;
  google.protobuf.Any details = 4;
  // refused is set by a node that refused a grain message before any handler
  // ran it, because the node is shutting down. The sender can then release the
  // node's registry record and send the message again elsewhere without the
  // message running twice. It is never set for an error a handler reported.
  bool refused = 5;
}
