syntax = "proto3";

package internalpb;

import "google/protobuf/duration.proto";
import "internal/dependency.proto";
import "internal/reentrancy.proto";

option go_package = "github.com/tochemey/goakt/v4/internal/internalpb;internalpb";

message GrainId {
  string kind = 1;
  string name = 2;
  string value = 3;
}

// Grain represents the virtual actor information on the wire.
message Grain {
  GrainId grain_id = 1;
  string host = 2;
  int32 port = 3;
  repeated internalpb.Dependency dependencies = 4;
  google.protobuf.Duration activation_timeout = 5;
  int32 activation_retries = 6;
  optional int64 mailbox_capacity = 7;
  bool disable_relocation = 8;
  // eager_relocation opts the grain into upfront reactivation on another node
  // when its host departs the cluster. When false (default) the grain relocates
  // lazily: its directory entry is cleaned and it re-activates on next use.
  bool eager_relocation = 9;
  // reentrancy carries the grain's async request policy so that eager
  // relocation and remote activation reconstruct it. Absent when the grain has
  // no policy.
  internalpb.ReentrancyConfig reentrancy = 10;
  // role carries the node role required to host the grain
  // (WithActivationRole) so that eager relocation and remote activation
  // preserve role-constrained placement. Absent when the grain has no role
  // constraint.
  optional string role = 11;
}
